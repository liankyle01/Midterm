<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register & Login</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f5e2e2; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 1.5rem; }
  .m { max-width: 750px; width: 100%; background: #fff7f7; border-radius: 1.5rem; box-shadow: 0 15px 35px rgba(60,10,10,.18); padding: 2rem; }
  h1 { color: #5a0f0f; text-align: center; border-bottom: 2px solid #d4b0b0; padding-bottom: .7rem; margin-bottom: 1.5rem; }
  .f { display: flex; flex-wrap: wrap; gap: 1.5rem; }
  .c { flex: 1 1 280px; background: #fff; padding: 1.4rem; border-radius: 1.2rem; box-shadow: 0 6px 15px rgba(60,10,10,.08); border: 1px solid #f0dada; }
  .c h2 { color: #5a0f0f; font-size: 1.15rem; margin-bottom: 1rem; border-left: 4px solid #800020; padding-left: .6rem; }
  .i { margin-bottom: .85rem; }
  .i label { display: block; font-size: .85rem; font-weight: 500; color: #6b2020; margin-bottom: .25rem; }
  .i input { width: 100%; padding: .65rem .9rem; font-size: .9rem; border: 1.5px solid #ddc2c2; border-radius: .8rem; background: #fffbfb; outline: none; color: #3d0a0a; font-family: inherit; }
  .i input:focus { border-color: #800020; box-shadow: 0 0 0 3px rgba(128,0,32,.12); }
  button { width: 100%; padding: .7rem; font-size: .95rem; font-weight: 600; border: none; border-radius: 2rem; background: #800020; color: #fff; cursor: pointer; margin-top: .4rem; font-family: inherit; transition: .2s; }
  button:hover { background: #5c0017; }
  .msg { margin-top: .9rem; min-height: 2rem; font-size: .88rem; font-weight: 500; padding: .5rem .8rem; border-radius: 1rem; text-align: center; }
  .ok { background: #e6f5ea; color: #0a5e2a; border-left: 5px solid #1b8e4b; }
  .err { background: #fde3e3; color: #a11b1b; border-left: 5px solid #b83a3a; }
  .det { margin-top: 1rem; padding: .9rem 1rem; background: #faf0f0; border-radius: 1rem; border: 1px dashed #c99b9b; font-size: .88rem; color: #4a0f0f; display: none; }
  .det.show { display: block; }
  .hid { display: none !important; }
  .win { margin-top: 1.5rem; padding: 1rem; border-radius: 1.5rem; font-weight: 600; font-size: 1.15rem; text-align: center; background: #e6f5ea; color: #0a5e2a; border: 1px solid #a7d9b8; }
</style>
</head>
<body>
<div class="m">
  <h1>Register & Login</h1>

  <div id="f" class="f">
    <div class="c">
      <h2>Register</h2>
      <div class="i"><label>Username</label><input type="text" id="ru" autocomplete="off"></div>
      <div class="i"><label>Password</label><input type="password" id="rp"></div>
      <div class="i"><label>Confirm Password</label><input type="password" id="rc"></div>
      <button id="rb">Register</button>
      <div id="rm" class="msg"></div>
      <div id="rd" class="det"></div>
    </div>

    <div class="c">
      <h2>Login</h2>
      <div class="i"><label>Username</label><input type="text" id="lu" autocomplete="off"></div>
      <div class="i"><label>Password</label><input type="password" id="lp"></div>
      <button id="lb">Login</button>
      <div id="lm" class="msg"></div>
    </div>
  </div>

  <div id="w" class="win hid"></div>
</div>

<script>
  (function() {
    let u = '', p = '';

    function msg(el, text, type) {
      el.textContent = text;
      el.className = 'msg ' + type;
    }

    document.getElementById('rb').addEventListener('click', function() {
      const ru = document.getElementById('ru').value.trim();
      const rp = document.getElementById('rp').value;
      const rc = document.getElementById('rc').value;
      const rm = document.getElementById('rm');
      const rd = document.getElementById('rd');

      if (!ru || !rp || !rc) { msg(rm, 'All fields are required.', 'err'); return; }
      if (rp !== rc) { msg(rm, 'Passwords do not match.', 'err'); return; }

      u = ru; p = rp;
      msg(rm, 'Registration successful!', 'ok');

      rd.innerHTML = '<strong>Registered user:</strong> ' + ru + '<br><strong>Password:</strong> ' + '•'.repeat(Math.min(rp.length, 12));
      rd.classList.add('show');
    });

    document.getElementById('lb').addEventListener('click', function() {
      const lu = document.getElementById('lu').value.trim();
      const lp = document.getElementById('lp').value;
      const lm = document.getElementById('lm');

      if (!lu || !lp) { msg(lm, 'Both fields are required.', 'err'); return; }
      if (!u || !p) { msg(lm, 'No registered user. Please register first.', 'err'); return; }
      if (lu !== u || lp !== p) { msg(lm, 'Invalid credentials.', 'err'); return; }

      document.getElementById('w').textContent = 'Login Successful!';
      document.getElementById('w').classList.remove('hid');
      document.getElementById('f').classList.add('hid');
    });
  })();
</script>
</body>
</html>
